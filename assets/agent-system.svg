<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent product workflow</title>
  <desc id="desc">Animated workflow showing Observation, Context, Design, Capability, Action, and Evaluation around Ralph Loop.</desc>
  <defs>
    <linearGradient id="flowGradient" x1="96" y1="80" x2="864" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="0.5" stop-color="#14B8A6" />
      <stop offset="1" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.145 0 0 0 0 0.388 0 0 0 0 0.922 0 0 0 0.18 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <style>
      .label {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #0f172a;
        font-size: 20px;
        font-weight: 700;
      }

      .sub {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #64748b;
        font-size: 13px;
        font-weight: 500;
      }

      .small {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #2563eb;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .flow {
        stroke: url(#flowGradient);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 10 12;
        animation: flow 1.8s linear infinite;
      }

      .node {
        fill: url(#nodeGradient);
        stroke: #dbeafe;
        stroke-width: 1.4;
        filter: url(#softGlow);
      }

      .core {
        fill: #ffffff;
        stroke: #bfdbfe;
        stroke-width: 1.6;
        filter: url(#softGlow);
        animation: pulse 3.2s ease-in-out infinite;
      }

      .dot {
        fill: #2563eb;
        opacity: 0.88;
        animation: blink 1.6s ease-in-out infinite;
      }

      .dot:nth-of-type(2) {
        animation-delay: 0.25s;
      }

      .dot:nth-of-type(3) {
        animation-delay: 0.5s;
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -44;
        }
      }

      @keyframes pulse {
        0%, 100% {
          stroke-width: 1.6;
          transform: scale(1);
          transform-origin: center;
        }
        50% {
          stroke-width: 2.4;
          transform: scale(1.015);
          transform-origin: center;
        }
      }

      @keyframes blink {
        0%, 100% {
          opacity: 0.35;
          transform: scale(0.82);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>
  </defs>

  <path d="M276 96H384" class="flow" marker-end="url(#arrow)" />
  <path d="M576 96H684" class="flow" marker-end="url(#arrow)" />
  <path d="M780 132V258" class="flow" marker-end="url(#arrow)" />
  <path d="M684 296H576" class="flow" marker-end="url(#arrow)" />
  <path d="M384 296H276" class="flow" marker-end="url(#arrow)" />
  <path d="M180 258V132" class="flow" marker-end="url(#arrow)" />

  <rect x="96" y="60" width="180" height="72" rx="18" class="node" />
  <text x="186" y="92" text-anchor="middle" class="label">Observation</text>
  <text x="186" y="114" text-anchor="middle" class="sub">spot the signal</text>

  <rect x="390" y="60" width="180" height="72" rx="18" class="node" />
  <text x="480" y="92" text-anchor="middle" class="label">Context</text>
  <text x="480" y="114" text-anchor="middle" class="sub">bring the receipts</text>

  <rect x="684" y="60" width="180" height="72" rx="18" class="node" />
  <text x="774" y="92" text-anchor="middle" class="label">Design</text>
  <text x="774" y="114" text-anchor="middle" class="sub">make it make sense</text>

  <rect x="684" y="258" width="180" height="72" rx="18" class="node" />
  <text x="774" y="290" text-anchor="middle" class="label">Capability</text>
  <text x="774" y="312" text-anchor="middle" class="sub">give it hands</text>

  <rect x="390" y="258" width="180" height="72" rx="18" class="node" />
  <text x="480" y="290" text-anchor="middle" class="label">Action</text>
  <text x="480" y="312" text-anchor="middle" class="sub">grab the hammer</text>

  <rect x="96" y="258" width="180" height="72" rx="18" class="node" />
  <text x="186" y="290" text-anchor="middle" class="label">Evaluation</text>
  <text x="186" y="312" text-anchor="middle" class="sub">admire it</text>

  <rect x="322" y="148" width="316" height="92" rx="24" class="core" />
  <text x="480" y="180" text-anchor="middle" class="small">AI BUILDER</text>
  <text x="480" y="207" text-anchor="middle" class="label">Everything is a ralph loop</text>

  <circle cx="355" cy="194" r="5" class="dot" />
  <circle cx="605" cy="194" r="5" class="dot" />
  <circle cx="480" cy="163" r="4" class="dot" />
</svg>
