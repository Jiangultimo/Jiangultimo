<svg width="960" height="150" viewBox="0 0 960 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hing title blinking in IAMCOOL Morse code</title>
  <desc id="desc">The title blinks in a repeating Morse code sequence that spells IAMCOOL.</desc>
  <defs>
    <filter id="titleGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.145 0 0 0 0 0.388 0 0 0 0 0.922 0 0 0 0.18 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .title {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #0f172a;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .subtitle {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #334155;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .morse {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        fill: #2563eb;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .hint {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #94a3b8;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <g filter="url(#titleGlow)">
    <text x="480" y="58" text-anchor="middle" class="title">Hing</text>
    <animate
      attributeName="opacity"
      dur="9.02s"
      repeatCount="indefinite"
      calcMode="discrete"
      keyTimes="0.000000;0.012195;0.024390;0.036585;0.073171;0.085366;0.097561;0.134146;0.170732;0.207317;0.219512;0.256098;0.292683;0.329268;0.341463;0.353659;0.365854;0.402439;0.414634;0.426829;0.463415;0.500000;0.512195;0.548780;0.560976;0.597561;0.634146;0.670732;0.682927;0.719512;0.731707;0.768293;0.804878;0.817073;0.829268;0.865854;0.878049;0.890244;0.902439;0.914634;1"
      values="1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;1;0.18;0.18" />
  </g>

  <text x="480" y="88" text-anchor="middle" class="subtitle">Product-minded AI Builder</text>
  <text x="480" y="118" text-anchor="middle" class="morse">.. .- -- -.-. --- --- .-..</text>
</svg>
